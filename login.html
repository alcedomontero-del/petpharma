<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrador - PetPharma</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm space-y-4">
    <div class="text-center space-y-1">
      <div class="w-14 h-14 bg-emerald-700 text-white rounded-2xl flex items-center justify-center font-black text-2xl shadow-md mx-auto">🐾</div>
      <h1 class="text-lg font-extrabold">PetPharma</h1>
      <p class="text-xs text-slate-400">Acceso exclusivo de Administración / Regencia Farmacéutica</p>
      <div id="badge-modo" class="pt-1"></div>
    </div>

    <form id="form-login" class="bg-white text-slate-900 rounded-3xl p-6 space-y-4 shadow-2xl text-xs">
      <div id="pista-demo" style="display:none;" class="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-3 text-[11px] font-medium">
        🧪 Modo demo: <strong>admin@petpharma.com</strong> / <strong>admin123</strong>
      </div>
      <div id="login-error" class="hidden bg-rose-50 border border-rose-200 text-rose-700 rounded-xl p-3 text-[11px] font-bold"></div>
      <div>
        <label class="block font-bold text-slate-700 mb-1">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="admin@petpharma.com" class="w-full border border-slate-300 rounded-xl p-2.5" />
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full border border-slate-300 rounded-xl p-2.5" />
      </div>
      <button type="submit" id="btn-login" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold py-2.5 rounded-xl transition-colors">
        Iniciar Sesión
      </button>
    </form>

    <p class="text-center text-[11px] text-slate-500">
      <a href="index.html" class="text-emerald-400 hover:underline">← Volver a la tienda</a>
    </p>
  </div>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
